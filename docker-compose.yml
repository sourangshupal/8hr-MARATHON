version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/enterprise_rag
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: enterprise_rag
      RATE_LIMIT_PER_MINUTE: "60"
      RAG_API_KEY: ""
      LOGFIRE_IGNORE_NO_CONFIG: "1"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - qdrant
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/enterprise_rag
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: enterprise_rag
      RAG_API_KEY: ""
      LOGFIRE_IGNORE_NO_CONFIG: "1"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - qdrant
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "-Q", "celery", "-c", "2"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

volumes:
  redis-data:
  postgres-data:
  qdrant-data:
