[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise Agentic RAG with LangGraph, Guardrails, and LLM Gateway"
requires-python = ">=3.11"
dependencies = [
    # --- CORE API ---
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "numpy==2.4.4",
    "pytz==2026.2",

    # --- VECTOR DB & RETRIEVAL ---
    "qdrant-client==1.17.1",
    "redis==7.4.0",

    # --- PRODUCTION PERSISTENCE & RELIABILITY ---
    "tenacity==9.1.2",
    "langgraph-checkpoint-postgres==2.0.16",
    "psycopg-pool==3.3.0",
    "psycopg-binary==3.3.0",
    "slowapi==0.1.9",

    # --- JINA API EMBEDDINGS + LOCAL FALLBACK ---
    "sentence-transformers==3.2.1",
    "torch==2.5.1",

    # --- LANGCHAIN & AGENTIC ORCHESTRATION ---
    "langchain==1.2.18",
    "langgraph==1.1.10",
    "langchain-google-vertexai==3.2.3",
    "langchain-community==0.4.1",
    "langchain-openai==1.2.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",

    # --- GUARDRAILS ---
    "nemoguardrails==0.21.0",
    "langchain-nvidia-ai-endpoints==1.3.0",

    # --- LLM GATEWAY ---
    "portkey-ai==2.3.0",

    # --- OBSERVABILITY ---
    "langsmith==0.8.3",
    "logfire[fastapi,requests]==4.32.1",
    "loguru==0.7.3",
    "prometheus-client==0.25.0",
    "prometheus-fastapi-instrumentator==8.0.2",

    # --- UI ---
    "streamlit==1.58.0",

    # --- INGESTION PARSERS ---
    "python-pptx==1.0.2",
    "python-docx==1.2.0",
    "pypdf==6.11.0",
    "beautifulsoup4==4.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "ragas",
    "deepeval",
    "nest-asyncio",
    "locust",
]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "node_modules",
    "__pycache__",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Import order is intentionally deferred so logfire/dotenv are configured first.
"app/main.py" = ["E402"]
"app/ingestion/processor.py" = ["E402", "I001"]
"evals/app.py" = ["E402"]
"evals/run_evals.py" = ["E402"]
"evals/metrics.py" = ["E402"]
"evals/pipeline.py" = ["E402"]
"evals/guardrails_eval.py" = ["E402"]
# __init__.py files re-export public symbols.
"app/**/__init__.py" = ["F401"]
"evals/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
